<style>
  :root{
    --bg:#faf8f6; --ink:#14110f; --muted:#6b625c;
    --line:#e6e0da; --card:#fff; --accent:#8c2f2f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131110; --ink:#f3efec; --muted:#a39a94;
      --line:#2a2522; --card:#1c1917; --accent:#d98b8b;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px; margin:0 auto; padding:40px 20px 64px}
  header{text-align:center; margin-bottom:34px}
  .name{font-size:26px; font-weight:650; letter-spacing:-.02em; margin:0 0 6px}
  .tag{color:var(--muted); font-size:15px; margin:0}
  .loc{color:var(--muted); font-size:13px; margin:10px 0 0; letter-spacing:.04em}
  h2{
    font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); font-weight:600; margin:34px 0 12px;
  }
  a.item{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:10px; transition:transform .12s ease, border-color .12s ease;
  }
  a.item:hover{transform:translateY(-1px); border-color:var(--accent)}
  .thumb{
    width:46px; height:46px; border-radius:10px; flex:0 0 auto;
    background:linear-gradient(135deg,var(--line),var(--bg));
    display:grid; place-items:center; font-size:19px;
  }
  .lines{min-width:0}
  .t{font-weight:600; font-size:15px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .s{color:var(--muted); font-size:13px; display:block; margin-top:2px}
  .arrow{margin-left:auto; color:var(--muted); flex:0 0 auto}
  .social{display:flex; justify-content:center; gap:10px; margin-top:30px; flex-wrap:wrap}
  .social a{
    text-decoration:none; color:var(--muted); font-size:13px;
    border:1px solid var(--line); border-radius:999px; padding:7px 14px;
  }
  .social a:hover{color:var(--ink); border-color:var(--accent)}
  footer{margin-top:38px; text-align:center; color:var(--muted); font-size:12px; line-height:1.7}
  .empty{
    border:1px dashed var(--line); border-radius:14px; padding:18px 16px;
    color:var(--muted); font-size:14px; text-align:center;
  }
</style>
